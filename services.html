<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Venues, photographers, food menus, makeup artists and wedding cakes — compare, check dates and book.">
  <title>Services — Forever Day</title>
  <script>
    try {
      var theme = localStorage.getItem("fd-theme");
      if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
      var lang = localStorage.getItem("fd-lang") || (navigator.language || "en").slice(0, 2);
      if (/^(en|ar|fr|it|de)$/.test(lang)) document.documentElement.setAttribute("lang", lang);
      if (lang === "ar") document.documentElement.setAttribute("dir", "rtl");
    } catch (error) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/all.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="services">
  <header id="site-header"></header>

  <main>
    <section class="page-hero" id="page-hero">
      <div class="container">
        <p class="script" id="hero-script"></p>
        <h1 id="hero-title"></h1>
        <p id="hero-text"></p>
      </div>
    </section>

    <section class="section tight">
      <div class="container">
        <div class="tabs tabs-scroll" id="cat-tabs" role="tablist"></div>

        <div class="toolbar card">
          <label class="search">
            <i class="fas fa-search"></i>
            <input type="search" id="search" data-i18n-ph="Search by name, style or area…" data-i18n-aria="Search">
          </label>
          <label class="field">
            <span data-i18n>Your day</span>
            <input type="date" class="input" id="filter-date">
          </label>
          <label class="field">
            <span data-i18n>Sort</span>
            <select class="input" id="sort">
              <option value="rating" data-i18n>Top rated</option>
              <option value="price-asc" data-i18n>Price: low to high</option>
              <option value="price-desc" data-i18n>Price: high to low</option>
              <option value="reviews" data-i18n>Most reviews</option>
            </select>
          </label>
          <div class="toggles">
            <label class="switch"><input type="checkbox" id="only-free"><span></span> <b data-i18n>Free on my day</b></label>
            <label class="switch"><input type="checkbox" id="only-favs"><span></span> <i class="fas fa-heart"></i> <b data-i18n>Favourites</b></label>
          </div>
        </div>

        <p class="muted results" id="results"></p>
        <div class="vendor-grid" id="vendors"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang/ar.js"></script>
  <script src="js/lang/fr.js"></script>
  <script src="js/lang/it.js"></script>
  <script src="js/lang/de.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services.js"></script>
</body>
</html>
